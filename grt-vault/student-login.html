<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — GRT College Vault</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="wrap">
  <div class="panel">
    <span class="stamp">STUDENT ACCESS</span>
    <h1 style="margin-top:14px;">Student Login</h1>
    <p class="sub">Enter your roll number to browse and download resources for your department.</p>

    <div class="form-error" id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="roll">Roll number</label>
        <input type="text" id="roll" placeholder="Enter your roll number" required>
        <small>Only GRT College students can sign in.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>

    <div class="divider">or</div>
    <a class="btn btn-outline btn-block" href="index.html">Back to access type</a>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  renderHeader(document.getElementById("header-mount"), { label: "STUDENT LOGIN", sub: "Student access" });
  renderFooter(document.getElementById("footer-mount"));

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const roll = document.getElementById("roll").value.trim();

    if(!roll){
      errorBox.textContent = "Please enter your roll number.";
      errorBox.style.display = "block";
      return;
    }
    if(!isValidStudentRoll(roll)){
      errorBox.textContent = "Incorrect roll number. Please check and try again.";
      errorBox.style.display = "block";
      return; 
    }

    setStudentLoggedIn(roll);
    window.location.href = "department-select.html?role=student";
  });
</script>
</body>
</html>
